[package]
name = "tableplus"
description = "A fast, native, low-memory database GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tableplus-rs"
path = "src/main.rs"

[dependencies]
tableplus-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu",
    "persistence",
    "wayland",
    "x11",
] }
rfd = "0.17"
# PNG output for the debug-only dev script's screenshots; already in the tree through eframe.
png = "0.18"
dirs = "6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native menu bar (macOS only).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
